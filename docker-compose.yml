# Для чего нужен этот файл:
# Шаблон запуска инфраструктуры и микросервисов через Docker Compose. Строки после символа # сейчас отключены.

# =============================================================================
# Docker Compose — ВРЕМЕННО ОТКЛЮЧЁН
# =============================================================================
# Весь стек закомментирован для локальной разработки без Docker.
# Для запуска используйте Start_test.py в корне и в каждом сервисе:
#   python Start_test.py              # все сервисы
#   python auth-service/Start_test.py # один сервис
#
# Чтобы включить Docker: раскомментируйте блоки ниже и выполните:
#   docker compose up -d --build
# =============================================================================

