<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сообщения — MieroVenture</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/messages.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="messages-page">
  <header class="messages-header">
    <a class="messages-brand" href="index.html">MieroVenture</a>
    <nav aria-label="Навигация">
      <a href="catalog.html">Каталог</a>
      <a href="my-listings.html">Мои объявления</a>
      <a href="profile.html">Профиль</a>
    </nav>
  </header>
  <main class="messages-shell" id="messages-app">
    <aside class="messages-sidebar">
      <h1>Сообщения</h1>
      <div id="conversation-list" class="conversation-list" aria-label="Список диалогов"></div>
    </aside>
    <section class="messages-main" aria-label="Текущий диалог">
      <div id="message-feed" class="message-feed" aria-live="polite"></div>
      <form id="message-form" class="message-form">
        <label class="visually-hidden" for="message-text">Сообщение</label>
        <textarea id="message-text" name="text" rows="2" maxlength="5000" placeholder="Напишите сообщение…" required></textarea>
        <button type="submit">Отправить</button>
      </form>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
