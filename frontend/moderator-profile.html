              <span>Уведомления</span>

            <p class="settings__group-title">Рабочие уведомления</p>

            <label class="setting">
              <span>Новые объявления на модерацию</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_moderation_ads" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Новые жалобы на объявления</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_complaints">
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Изменение статуса проверяемых объявлений</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_review_status" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Новые сообщения от пользователей</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_user_messages">
                <span class="switch__track"></span>
              </span>
            </label>

            <hr class="settings__divider">

            <p class="settings__group-title">Уведомления о работе платформы</p>

            <label class="setting">
              <span>Изменения правил модерации</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_moderation_rules" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Технические сбои и ошибки</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_technical_errors">
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Изменения в работе аналитических сервисов</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="notify_analytics_changes" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <hr class="settings__divider">

            <p class="settings__group-title">Уведомления по электронной почте</p>

            <label class="setting">
              <span>Получать письма о новых объявлениях на модерацию</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="email_moderation_ads" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Получать письма о новых жалобах</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="email_complaints">
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Получать ежедневную сводку по работе модерации</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="email_daily_digest" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting">
              <span>Получать письма о важных изменениях платформы</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="email_platform_changes" checked>
                <span class="switch__track"></span>
              </span>
            </label>

            <label class="setting setting--last">
              <span>Получать уведомления о технических проблемах</span>
              <span class="switch">
                <input type="checkbox" role="switch" name="email_technical_problems">
                <span class="switch__track"></span>
              </span>
            </label>
