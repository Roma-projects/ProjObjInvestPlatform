# Внешний веб-сервер: раздаёт клиент, проксирует API и WebSocket, читает публичные файлы.
server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    location /public/uploads/ {
        alias /public_uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        limit_except GET HEAD { deny all; }
    }

    location /public/avatars/ {
        alias /auth_avatars/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        limit_except GET HEAD { deny all; }
    }

    location ~* \.(?:html|css|js|svg)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /ws/notifications {
        proxy_pass http://notification-service:8000/ws/notifications;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api-gateway:8000/;
        proxy_cookie_path /auth /api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/auth/me/avatar {
        client_max_body_size 6m;
        proxy_pass http://api-gateway:8000/auth/me/avatar;
        proxy_cookie_path /auth /api/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
